# Quarkus configuration (YAML)
quarkus:
  datasource:
    db-kind: postgresql
    username: admin
    password: admin
    jdbc:
      url: jdbc:postgresql://localhost:5432/crud
      max-size: 50
      min-size: 5
  flyway:
    migrate-at-start: true
    locations: db/migration
  hibernate-orm:
    physical-naming-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    schema-management:
      strategy: none
  jackson:
    property-naming-strategy: SNAKE_CASE
    write-dates-as-timestamps: false
  log:
    category:
      "org.flywaydb":
        level: INFO
  http:
    port: 8080
    cors:
      enabled: true
      origins: http://localhost:4200
      methods: GET,POST,PUT,DELETE,OPTIONS
      headers: Content-Type,Authorization,X-Requested-With,Accept,Origin
      exposed-headers: Content-Type,Authorization
      access-control-allow-credentials: true
  redis:
    hosts: redis://localhost:6379
    password: admin
  smallrye-openapi:
    info-title: Test CRUD API
    info-version: 0.0.8
    info-description: CRUD User API with Quarkus
  swagger-ui:
    always-include: true
  native:
    additional-build-args: --initialize-at-run-time=com.password4j.AlgorithmFinder
app:
  auth:
    token-ttl-seconds: 604800
    cookie-name: access_token
    cookie-secure: false
    cookie-same-site: Lax
    cookie-path: /
    cookie-max-age-seconds: 604800

# Virtual threads enabled via @RunOnVirtualThread - no extra config needed (defaults are sufficient)
