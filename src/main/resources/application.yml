# Quarkus configuration (YAML)
quarkus:
  datasource:
    db-kind: postgresql
    username: admin
    password: admin
    jdbc:
      url: jdbc:postgresql://localhost:5432/crud
      max-size: 50
      min-size: 5
  flyway:
    migrate-at-start: true
    locations: db/migration
  hibernate-orm:
    physical-naming-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    schema-management:
      strategy: none
  jackson:
    property-naming-strategy: SNAKE_CASE
    write-dates-as-timestamps: false
  log:
    category:
      "org.flywaydb":
        level: INFO
  http:
    port: 8080
  smallrye-openapi:
    info-title: Test CRUD API
    info-version: 0.0.6
    info-description: CRUD User API with Quarkus
  swagger-ui:
    always-include: true

# Virtual threads enabled via @RunOnVirtualThread - no extra config needed (defaults are sufficient)
